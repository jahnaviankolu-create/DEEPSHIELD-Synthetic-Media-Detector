<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepShield – Connected React AI Detection Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- React 18 & ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel Standalone CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="src/App.css">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const API_BASE_URL = 'http://127.0.0.1:8001';

        // Image Detection Card Component
        const ImageDetectionCard = () => {
            const [selectedFile, setSelectedFile] = useState(null);
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState('');

            const handleFileChange = (e) => {
                if (e.target.files && e.target.files[0]) {
                    setSelectedFile(e.target.files[0]);
                    setResult(null);
                    setError('');
                }
            };

            const handleAnalyze = async () => {
                if (!selectedFile) {
                    setError('Please select an image file first.');
                    return;
                }

                setLoading(true);
                setError('');
                setResult(null);

                const formData = new FormData();
                formData.append('file', selectedFile);

                try {
                    const response = await fetch(`${API_BASE_URL}/predict/image`, {
                        method: 'POST',
                        body: formData,
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.detail || `Server error (Status ${response.status})`);
                    }

                    const data = await response.json();
                    setResult(data);
                } catch (err) {
                    console.error('Image Prediction Error:', err);
                    setError(err.message || 'Network error or backend server unavailable.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="detection-card">
                    <div className="card-header">
                        <div className="icon-wrapper image-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                                <circle cx="9" cy="9" r="2"/>
                                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                            </svg>
                        </div>
                        <div>
                            <h3 className="card-title">Image Detection</h3>
                            <p className="card-subtitle">Detect AI-generated or manipulated images</p>
                        </div>
                    </div>

                    <div className="upload-area">
                        <label htmlFor="image-file-input" className="upload-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" x2="12" y1="3" y2="15"/>
                            </svg>
                            <span>{selectedFile ? selectedFile.name : "Upload Image"}</span>
                        </label>
                        <input
                            id="image-file-input"
                            type="file"
                            accept="image/*"
                            onChange={handleFileChange}
                            style={{ display: 'none' }}
                        />
                    </div>

                    <button
                        className="analyze-btn"
                        onClick={handleAnalyze}
                        disabled={!selectedFile || loading}
                    >
                        {loading ? "Analyzing..." : "Analyze Image"}
                    </button>

                    {error && <div className="error-message">{error}</div>}

                    <div className="result-placeholder">
                        <div className="placeholder-row">
                            <span className="placeholder-label">Prediction</span>
                            <span className={`placeholder-value ${result ? (result.prediction.toLowerCase().includes('real') ? 'val-real' : 'val-fake') : ''}`}>
                                {result ? result.prediction : "--"}
                            </span>
                        </div>
                        <div className="placeholder-row">
                            <span className="placeholder-label">Confidence</span>
                            <span className="placeholder-value">
                                {result ? `${result.confidence} %` : "-- %"}
                            </span>
                        </div>
                        <div className="placeholder-row">
                            <span className="placeholder-label">Risk Level</span>
                            <span className="placeholder-value">
                                {result ? (result.risk_level ? `${result.risk_level} Risk` : (result.prediction.toLowerCase().includes('real') ? 'Low Risk' : 'High Risk')) : "--"}
                            </span>
                        </div>
                        <div className="placeholder-row">
                            <span className="placeholder-label">Processing Time</span>
                            <span className="placeholder-value">
                                {result ? `${result.processing_time || 0.45} s` : "-- s"}
                            </span>
                        </div>
                        <div className="placeholder-row">
                            <span className="placeholder-label">Model Used</span>
                            <span className="placeholder-value">
                                {result ? (result.model || "Vision Transformer") : "--"}
                            </span>
                        </div>
                        {result && result.explainability_images && result.explainability_images[0] && (
                            <div className="heatmap-preview-container" style={{ marginTop: '12px', textAlign: 'center' }}>
                                <span className="placeholder-label" style={{ display: 'block', marginBottom: '6px', fontSize: '11px', color: 'var(--text-muted)' }}>AI Explainability Heatmap</span>
                                <img src={result.explainability_images[0]} alt="Heatmap" style={{ width: '100%', maxHeight: '140px', borderRadius: '6px', border: '1px solid rgba(255,255,255,0.1)' }} />
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Video Detection Card Component
        const VideoDetectionCard = () => {
            const [selectedFile, setSelectedFile] = useState(null);
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState('');

            const handleFileChange = (e) => {
                if (e.target.files && e.target.files[0]) {
                    setSelectedFile(e.target.files[0]);
                    setResult(null);
                    setError('');
                }
            };

            const handleAnalyze = async () => {
                if (!selectedFile) {
                    setError('Please select a video file first.');
                    return;
                }

                setLoading(true);
                setError('');
                setResult(null);

                const formData = new FormData();
                formData.append('file', selectedFile);

                try {
                    const response = await fetch(`${API_BASE_URL}/predict/video`, {
                        method: 'POST',
                        body: formData,
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.detail || `Server error (Status ${response.status})`);
                    }

                    const data = await response.json();
                    setResult(data);
                } catch (err) {
                    console.error('Video Prediction Error:', err);
                    setError(err.message || 'Network error or backend server unavailable.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="detection-card">
                    <div className="card-header">
                        <div className="icon-wrapper video-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <path d="m22 8-6 4 6 4V8Z"/>
                                <rect width="14" height="12" x="2" y="6" rx="2" ry="2"/>
                            </svg>
                        </div>
                        <div>
                            <h3 className="card-title">Video Detection</h3>
                            <p className="card-subtitle">Analyze videos for deepfake & face-swap artifacts</p>
                        </div>
                    </div>

                    <div className="upload-area">
                        <label htmlFor="video-file-input" className="upload-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" x2="12" y1="3" y2="15"/>
                            </svg>
                            <span>{selectedFile ? selectedFile.name : "Upload Video"}</span>
                        </label>
                        <input
                            id="video-file-input"
                            type="file"
                            accept="video/*"
                            onChange={handleFileChange}
                            style={{ display: 'none' }}
                        />
                    </div>

                    <button
                        className="analyze-btn"
                        onClick={handleAnalyze}
                        disabled={!selectedFile || loading}
                    >
                        {loading ? "Analyzing..." : "Analyze Video"}
                    </button>

                    {error && <div className="error-message">{error}</div>}

                    <div className="result-placeholder">
                        <div className="placeholder-row">
                            <span className="placeholder-label">Prediction</span>
                            <span className={`placeholder-value ${result ? (result.prediction.toLowerCase().includes('real') ? 'val-real' : 'val-fake') : ''}`}>
                                {result ? result.prediction : "--"}
                            </span>
                        </div>
                        <div className="placeholder-row">
                            <span className="placeholder-label">Confidence</span>
                            <span className="placeholder-value">
                                {result ? `${result.confidence} %` : "-- %"}
                            </span>
                        </div>
                        <div className="placeholder-row">
                            <span className="placeholder-label">Risk Level</span>
                            <span className="placeholder-value">
                                {result ? (result.risk_level ? `${result.risk_level} Risk` : (result.prediction.toLowerCase().includes('real') ? 'Low Risk' : 'High Risk')) : "--"}
                            </span>
                        </div>
                        <div className="placeholder-row">
                            <span className="placeholder-label">Processing Time</span>
                            <span className="placeholder-value">
                                {result ? `${result.processing_time || 0.45} s` : "-- s"}
                            </span>
                        </div>
                        <div className="placeholder-row">
                            <span className="placeholder-label">Model Used</span>
                            <span className="placeholder-value">
                                {result ? (result.model || "VideoMAE") : "--"}
                            </span>
                        </div>
                        {result && result.explainability_images && result.explainability_images[0] && (
                            <div className="heatmap-preview-container" style={{ marginTop: '12px', textAlign: 'center' }}>
                                <span className="placeholder-label" style={{ display: 'block', marginBottom: '6px', fontSize: '11px', color: 'var(--text-muted)' }}>AI Explainability Heatmap</span>
                                <img src={result.explainability_images[0]} alt="Heatmap" style={{ width: '100%', maxHeight: '140px', borderRadius: '6px', border: '1px solid rgba(255,255,255,0.1)' }} />
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Audio Detection Card Component
        const AudioDetectionCard = () => {
            const [selectedFile, setSelectedFile] = useState(null);
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState('');

            const handleFileChange = (e) => {
                if (e.target.files && e.target.files[0]) {
                    setSelectedFile(e.target.files[0]);
                    setResult(null);
                    setError('');
                }
            };

            const handleAnalyze = async () => {
                if (!selectedFile) {
                    setError('Please select an audio file first.');
                    return;
                }

                setLoading(true);
                setError('');
                setResult(null);

                const formData = new FormData();
                formData.append('file', selectedFile);

                try {
                    const response = await fetch(`${API_BASE_URL}/predict/audio`, {
                        method: 'POST',
                        body: formData,
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.detail || `Server error (Status ${response.status})`);
                    }

                    const data = await response.json();
                    setResult(data);
                } catch (err) {
                    console.error('Audio Prediction Error:', err);
                    setError(err.message || 'Network error or backend server unavailable.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="detection-card">
                    <div className="card-header">
                        <div className="icon-wrapper audio-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                <line x1="12" x2="12" y1="19" y2="22"/>
                            </svg>
                        </div>
                        <div>
                            <h3 className="card-title">Audio Detection</h3>
                            <p className="card-subtitle">Detect synthetic voices & neural speech clones</p>
                        </div>
                    </div>

                    <div className="upload-area">
                        <label htmlFor="audio-file-input" className="upload-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" x2="12" y1="3" y2="15"/>
                            </svg>
                            <span>{selectedFile ? selectedFile.name : "Upload Audio"}</span>
                        </label>
                        <input
                            id="audio-file-input"
                            type="file"
                            accept="audio/*"
                            onChange={handleFileChange}
                            style={{ display: 'none' }}
                        />
                    </div>

                    <button
                        className="analyze-btn"
                        onClick={handleAnalyze}
                        disabled={!selectedFile || loading}
                    >
                        {loading ? "Analyzing..." : "Analyze Audio"}
                    </button>

                    {error && <div className="error-message">{error}</div>}

                    <div className="result-placeholder">
                        <div className="placeholder-row">
                            <span className="placeholder-label">Prediction</span>
                            <span className={`placeholder-value ${result ? (result.prediction.toLowerCase().includes('real') ? 'val-real' : 'val-fake') : ''}`}>
                                {result ? result.prediction : "--"}
                            </span>
                        </div>
                        <div className="placeholder-row">
                            <span className="placeholder-label">Confidence</span>
                            <span className="placeholder-value">
                                {result ? `${result.confidence} %` : "-- %"}
                            </span>
                        </div>
                        <div className="placeholder-row">
                            <span className="placeholder-label">Risk Level</span>
                            <span className="placeholder-value">
                                {result ? (result.risk_level ? `${result.risk_level} Risk` : (result.prediction.toLowerCase().includes('real') ? 'Low Risk' : 'High Risk')) : "--"}
                            </span>
                        </div>
                        <div className="placeholder-row">
                            <span className="placeholder-label">Processing Time</span>
                            <span className="placeholder-value">
                                {result ? `${result.processing_time || 0.45} s` : "-- s"}
                            </span>
                        </div>
                        <div className="placeholder-row">
                            <span className="placeholder-label">Model Used</span>
                            <span className="placeholder-value">
                                {result ? (result.model || "Wav2Vec2") : "--"}
                            </span>
                        </div>
                        {result && result.explainability_images && result.explainability_images[0] && (
                            <div className="heatmap-preview-container" style={{ marginTop: '12px', textAlign: 'center' }}>
                                <span className="placeholder-label" style={{ display: 'block', marginBottom: '6px', fontSize: '11px', color: 'var(--text-muted)' }}>AI Explainability Heatmap</span>
                                <img src={result.explainability_images[0]} alt="Heatmap" style={{ width: '100%', maxHeight: '140px', borderRadius: '6px', border: '1px solid rgba(255,255,255,0.1)' }} />
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            return (
                <div className="app-layout">
                    <header className="app-header">
                        <div className="header-brand">
                            <div className="shield-logo">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
                                    <path d="m9 12 2 2 4-4"/>
                                </svg>
                            </div>
                            <div className="brand-text">
                                <h2>DeepShield</h2>
                                <span className="brand-badge">AI Detection Suite</span>
                            </div>
                        </div>

                        <div className="header-status">
                            <span className="status-indicator"></span>
                            <span className="status-text">System Active</span>
                        </div>
                    </header>

                    <main className="dashboard-container">
                        <div className="dashboard-title-section">
                            <h1 className="dashboard-heading">Synthetic Media Analysis Dashboard</h1>
                            <p className="dashboard-subheading">Select a detection module below to inspect media files for deepfakes and AI synthesis.</p>
                        </div>

                        <div className="cards-grid">
                            <ImageDetectionCard />
                            <VideoDetectionCard />
                            <AudioDetectionCard />
                        </div>
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
